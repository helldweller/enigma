{{- if not .Values.existingSecret }}
{{- /* Generated once; lookup returns the live Secret so upgrades keep the same keys. */}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace .Release.Name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "enigma.labels" . | nindent 4 }}
type: Opaque
data:
  master-key: {{ index $old "master-key" | default (randAlphaNum 48 | b64enc) }}
  redis-password: {{ index $old "redis-password" | default (randAlphaNum 32 | b64enc) }}
{{- end }}
